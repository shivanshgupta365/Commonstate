name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Reject legacy hosted-runtime coupling
        shell: bash
        run: |
          if git grep -nEi '(vinext|cloudflare:workers|@cloudflare/|wrangler|/_vinext|dist/server|\.openai/hosting)' -- . ':(exclude).github/**' ':(exclude)docs/**' ':(exclude)README.md' ':(exclude)tests/**' ':(exclude)package-lock.json'; then
            echo 'Legacy ChatGPT Sites, Vinext, or Cloudflare runtime coupling remains.' >&2
            exit 1
          fi
          node -e 'const p=require("./package.json"); const names=Object.keys({...p.dependencies,...p.devDependencies}); const forbidden=["vinext","vite","wrangler","@cloudflare/vite-plugin","@cloudflare/workers-types","@vitejs/plugin-react","@vitejs/plugin-rsc"]; const found=forbidden.filter((name)=>names.includes(name)); if(found.length) { console.error(`Forbidden direct dependencies: ${found.join(", ")}`); process.exit(1); }'

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: |
          npm run typecheck
          npm run typecheck:workspaces

      - name: Validate dedicated deployment plan
        run: |
          npm run --silent deploy:dedicated:verify > /tmp/commonstate-dedicated-plan.json
          node -e 'const p=require("/tmp/commonstate-dedicated-plan.json"); if(!/^[a-f0-9]{64}$/.test(p.manifestHash)||!/^[a-f0-9]{64}$/.test(p.planHash)||p.phases.length!==5) process.exit(1)'

  node-contracts:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build native Next production output
        run: npm run build

      - name: Run platform, product, storage, and identity contracts
        run: npm run test:contracts

  postgres-integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://commonstate:commonstate@127.0.0.1:5432/commonstate_test
      MIGRATION_DATABASE_URL: postgresql://commonstate:commonstate@127.0.0.1:5432/commonstate_test
      PRODUCT_DATABASE_URL: postgresql://commonstate_runtime:commonstate_runtime_ci@127.0.0.1:5432/commonstate_test
      COMMONSTATE_CREDENTIAL_PEPPER: ci-product-credential-pepper
      COMMONSTATE_EXPECT_STORAGE_MODE: postgres

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commonstate_test
          POSTGRES_USER: commonstate
          POSTGRES_PASSWORD: commonstate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commonstate -d commonstate_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Apply Postgres migrations
        run: |
          npm run db:migrate
          npm run db:migrate

      - name: Install and verify the restricted runtime role
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/runtime-role.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE commonstate_runtime LOGIN PASSWORD 'commonstate_runtime_ci'"
          test "$(psql "$PRODUCT_DATABASE_URL" -Atc 'select current_user')" = "commonstate_runtime"
          test "$(psql "$DATABASE_URL" -Atc "select rolbypassrls from pg_roles where rolname = 'commonstate_runtime'")" = "f"
          test "$(psql "$DATABASE_URL" -Atc "select rolsuper from pg_roles where rolname = 'commonstate_runtime'")" = "f"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into organizations (id, slug, name) values ('ci_rls_probe_org', 'ci-rls-probe', 'CI RLS probe') on conflict (id) do nothing; insert into workspaces (id, organization_id, slug, name, edition) values ('ci_rls_probe_workspace', 'ci_rls_probe_org', 'ci-rls-probe', 'CI RLS probe', 'blank') on conflict (id) do nothing"
          test "$(psql "$DATABASE_URL" -Atc "select count(*) from workspaces where id = 'ci_rls_probe_workspace'")" = "1"
          test "$(psql "$PRODUCT_DATABASE_URL" -Atc "select count(*) from workspaces where id = 'ci_rls_probe_workspace'")" = "0"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "delete from organizations where id = 'ci_rls_probe_org'"

      - name: Build native Next production output
        run: npm run build

      - name: Verify contracts against durable storage
        run: npm run test:contracts

  browser-live:
    needs: [node-contracts, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://commonstate:commonstate@127.0.0.1:5432/commonstate_browser
      MIGRATION_DATABASE_URL: postgresql://commonstate:commonstate@127.0.0.1:5432/commonstate_browser
      PRODUCT_DATABASE_URL: postgresql://commonstate_runtime:commonstate_runtime_ci@127.0.0.1:5432/commonstate_browser
      COMMONSTATE_CREDENTIAL_PEPPER: ci-browser-credential-pepper
      COMMONSTATE_E2E_LOCAL_AUTH: "true"
      COMMONSTATE_EXPECT_STORAGE_MODE: postgres

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commonstate_browser
          POSTGRES_USER: commonstate
          POSTGRES_PASSWORD: commonstate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commonstate -d commonstate_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Apply Postgres migrations
        run: npm run db:migrate

      - name: Install and verify the restricted runtime role
        shell: bash
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f drizzle/runtime-role.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "ALTER ROLE commonstate_runtime LOGIN PASSWORD 'commonstate_runtime_ci'"
          test "$(psql "$PRODUCT_DATABASE_URL" -Atc 'select current_user')" = "commonstate_runtime"
          test "$(psql "$DATABASE_URL" -Atc "select rolbypassrls from pg_roles where rolname = 'commonstate_runtime'")" = "f"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into organizations (id, slug, name) values ('ci_rls_probe_org', 'ci-rls-probe', 'CI RLS probe') on conflict (id) do nothing; insert into workspaces (id, organization_id, slug, name, edition) values ('ci_rls_probe_workspace', 'ci_rls_probe_org', 'ci-rls-probe', 'CI RLS probe', 'blank') on conflict (id) do nothing"
          test "$(psql "$PRODUCT_DATABASE_URL" -Atc "select count(*) from workspaces where id = 'ci_rls_probe_workspace'")" = "0"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "delete from organizations where id = 'ci_rls_probe_org'"

      - name: Build native Next production output
        run: npm run build

      - name: Install Chromium
        run: npm run playwright:install

      - name: Run live browser workflows
        run: npm run test:e2e:live

      - name: Upload live browser artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-live
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    needs: node-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --prefer-offline

      - name: Build native Next production output
        run: npm run build

      - name: Enforce Lighthouse accessibility and best-practices gates
        run: npx --no-install lhci autorun --config lighthouserc.cjs

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
